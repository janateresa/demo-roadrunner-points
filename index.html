-template-columns:70px 1fr;gap:15px}.bigBadge{width:70px;height:70px;border-radius:18px;background:#f2eee7;display:grid;place-items:center;font-size:40px}.claimResult label{grid-column:1/-1}.adminUser{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);padding:10px 13px;border-radius:9px;font-weight:900}.adminTabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin:30px 0}.adminTabs button{border:0;background:none;padding:13px 15px;font-weight:900;color:var(--muted);border-bottom:3px solid transparent}.adminTabs button.active{color:var(--burg);border-bottom-color:var(--burg)}.adminStats{grid-template-columns:repeat(4,1fr)}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px}.statIcon{font-size:22px;color:var(--burg)}.stat span{display:block;color:var(--muted);font-size:13px;margin-top:10px}.stat strong{font-size:30px;color:var(--navy)}.adminGrid{display:grid;grid-template-columns:1.5fr .8fr;gap:18px}.activity{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:12px 0}.activity div{display:flex;flex-direction:column;flex:1}.activity span{font-size:12px;color:var(--muted)}.activity small{color:#999}.miniBadge{width:40px;height:40px;border-radius:11px;background:#f2eee7;display:grid;place-items:center;font-size:22px}.quick{display:flex;flex-direction:column;gap:8px}.quick>button{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;padding:13px;border-radius:8px;font-weight:900;color:var(--navy)}.quick>button span:last-child{margin-left:auto}.search{display:flex;gap:8px;align-items:center;border:1px solid var(--line);padding:0 12px;border-radius:8px;margin-bottom:15px}.search input{border:0;outline:0;padding:12px;flex:1}.familyRow,.badgeAdmin{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:14px 0}.familyRow>div,.badgeAdmin>div:nth-child(2){display:flex;flex-direction:column;flex:1}.familyRow span,.badg t .eventActions{margin-left:auto}.empty{padding:18px 0;color:var(--muted);font-size:13px}.pill{display:inline-block;border-radius:20px;padding:5px 9px;background:#eef3f7;color:var(--navy);font-size:10px;font-weight:900}.eventQr{display:grid;grid-template-columns:1fr 180px;gap:22px;align-items:center}footer{background:#fff;border-top:1px solid var(--line);padding:22px 24px;display:flex;align-items:center;gap:12px}footer img{width:45px;height:40px;object-fit:contain}footer div{display:flex;flex-direction:column;color:var(--navy)}footer div span{font-size:11px;color:var(--muted)}.footnote{margin-left:auto;color:#aaa;font-size:11px}.toast{position:fixed;right:22px;bottom:22px;background:var(--navy);color:#fff;padding:14px 18px;border-radius:10px;font-weight:800;z-index:20;box-shadow:0 12px 30px #0003}.hidden{display:none!important}@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:45px}.hero h1{font-size:50px}.heroCard{min-height:330px}.steps,.badgeGrid,.dashGrid,.adminGrid,.adminTwo{grid-template-columns:1fr}.stats,.adminStats{grid-template-columns:1fr 1fr}.qrGrid{grid-template-columns:repeat(2,1fr)}nav{display:none}.hamb{display:block}nav.open{display:flex;position:absolute;top:76px;left:0;right:0;background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;flex-direction:column;align-items:stretch}.sectionHead,.dashHero,.adminHeader{align-items:start;flex-direction:column}.band{flex-direction:column;align-items:start}.footnote{display:none}}@media(max-width:480px){.stats,.adminStats{grid-template-columns:1fr}.hero{padding-left:18px;padding-right:18px}.hero h1{font-size:43px}.actions{flex-direction:column}.badgeGrid{grid-template-columns:1fr}.dashboard,.admin{padding-left:16px;padding-right:16px}.auth,.claim{padding:25px}.qrGrid{grid-template-columns:1fr 1fr}.topinner{padding-left:14px;padding-right:14px}}

<body><div id="app"></div>
<script>
const logo='assets/roadrunner.png';
const starter={families:[{id:'fam-smith',name:'Smith Family',email:'smith@example.com',members:[{id:'m-jane',name:'Jane Smith',kind:'Adult',points:65,badges:['welcome','coffee']},{id:'m-emma',name:'Emma Smith',kind:'Child',grade:'4th Grade',points:50,badges:['harvest','reader']}]}],badges:[{id:'welcome',name:'Roadrunner Rookie',description:'Welcome to the Repetto PTA family!',points:10,category:'PTA',image:'🏃',active:true,token:'RR-WELCOME-2026'},{id:'coffee',name:'Coffee Social',description:'Stopped by a Repetto PTA coffee social.',points:15,category:'Community',image:'☕',active:true,token:'RR-COFFEE-2026'},{id:'harvest',name:'Harvest Festival Hero',description:'Joined the fun at Harvest Festival.',points:25,category:'School Spirit',image:'🎃',active:true,token:'RR-HARVEST-2026'},{id:'reader',name:'Reading Roadrunner',description:'Completed a family reading challenge.',points:20,category:'Family',image:'📚',active:true,token:'RR-READER-2026'},{id:'volunteer',name:'Volunteer MVP',description:'Gave time to make Repetto better.',points:50,category:'Community',image:'🤝',active:true,token:'RR-VOLUNTEER-2026'}],events:[{id:'e-harvest',name:'Harvest Festival',date:'2026-10-24',time:'5:00 PM',location:'Repetto Elementary',description:'Join the school community for an evening of games, food and fun.',badgeId:'harvest',active:true,token:'RR-EVENT-HARVEST-2026'},{id:'e-movie',name:'Family Movie Night',date:'2026-10-30',time:'6:30 PM',location:'Repetto Multipurpose Room',description:'Bring the family for a movie night under the Roadrunner lights.',badgeId:'volunteer',active:true,token:'RR-EVENT-MOVIE-2026'}],claims:[{badgeId:'welcome',memberId:'m-jane',date:'2026-08-14'},{badgeId:'coffee',memberId:'m-jane',date:'2026-08-28'},{badgeId:'harvest',memberId:'m-emma',date:'2026-08-30'},{badgeId:'reader',memberId:'m-emma',date:'2026-09-01'}]};
let state=JSON.parse(localStorage.getItem('rr-demo')||'null')||starter;state.events=state.events||[];let view='home';let toastTimer;
const save=()=>localStorage.setItem('rr-demo',JSON.stringify(state));const total=f=>f.members.reduce((a,m)=>a+m.points,0);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setView(v){view=v;render();window.scrollTo(0,0)}function toast(t){clearTimeout(toastTimer);document.body.insertAdjacentHTML('beforeend',`<div class="toast" id="toast">✓ &nbsp;${esc(t)}</div>`);toastTimer=setTimeout(()=>document.getElementById('toast')?.remove(),2800)}
function shell(content){return `<div class="app"><header class="topbar"><div class="topinner"><button class="brand" onclick="setView('home')"><img src="${logo}"><span><b>Repetto PTA</b><small>Roadrunner Rewards</small></span></button><button class="hamb" onclick="document.querySelector('nav').classList.toggle('open')">☰</button><nav><button onclick="setView('home')">Home</button><button onclick="setView('dashboard')">My Family</button><button onclick="setView('claim')">Claim Badge</button><button onclick="setView('admin')">Admin</button><button class="loginBtn" onclick="setView('login')">Sign In</button></nav></div></header>${content}<footer><img src="${logo}"><div><b>Repetto Elementary School PTA</b><span>Every Child. One Voice.</span></div><span class="footnote">Roadrunner Rewards demo • Built for Repetto PTA</span></footer></div>`}

function render(){document.getElementById('app').innerHTML=shell(view==='home'?home():view==='login'?login():view==='dashboard'?dashboard():view==='admin'?admin():claim());if(view==='claim')makeDemoQr();if(view==='admin')setTimeout(()=>adminTab(location.hash==='qr'?'qr':'overview'),0)}

function home(){const upcoming=state.events.filter(e=>e.active&&e.date>='2026-09-04').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,2);return `<main><section class="hero"><div><div class="eyebrow">✦ A NEW WAY TO GET INVOLVED</div><h1>Run with the <em>Roadrunners.</em></h1><p>Join in. Show up. Lend a hand. Collect badges and celebrate everything your family does for Repetto.</p><div class="actions"><button class="primary" onclick="setView('login')">Create a Family Account →</button><button class="secondary" onclick="setView('claim')">▣ Scan a Badge</button></div></div><div class="heroCard"><div class="sun">★</div><img src="${logo}"><div class="heroBadge">ROADRUNNER REWARDS</div><p>Every adventure earns something.</p></div></section><section class="section"><div class="sectionHead"><div><span class="kicker">HOW IT WORKS</span><h2>Little moments. Big impact.</h2></div><p>Your family can collect badges for participating in the Repetto community.</p></div><div class="steps"><article class="step"><span class="stepnum">01</span><div class="iconCircle">👨‍👩‍👧</div><h3>Join your family</h3><p>Create one family account and add adults and children.</p></article><article class="step"><span class="stepnum">02</span><div class="iconCircle">🤝</div><h3>Get involved</h3><p>Attend events, volunteer, fundraise, read, celebrate and help.</p></article><article class="step"><span class="stepnum">03</span><div class="iconCircle">🏆</div><h3>Collect badges</h3><p>Scan an event QR code or have a PTA admin award a badge.</p></article></div></section><section class="section eventSection"><div class="sectionHead"><div><span class="kicker">UP NEXT</span><h2>Upcoming Roadrunner events</h2></div><p>Every event can have its own attendance badge and QR code.</p></div><div class="eventList">${upcoming.map(eventCard).join('')||'<div class="empty">New events are coming soon!</div>'}</div></section><section class="band"><div><span class="kicker" style="color:#e6b7c5">YOUR COLLECTION</span><h2>Every badge tells a story.</h2><p>Build a colorful collection that shows how your family is making Repetto stronger.</p></div><div class="badgePreview">${['🎃','🤝','📚','☕','🏃','⭐'].map(x=>`<div>${x}</div>`).join('')}</div></section></main>`}
function eventCard(e){const b=state.badges.find(x=>x.id===e.badgeId),d=new Date(e.date+'T12:00:00');return `<article class="eventCard"><div class="eventDate"><b>${d.getDate()}</b><span>${d.toLocaleString('en-US',{month:'short'})}</span></div><div><h3>${esc(e.name)}</h3><p>${esc(e.time)} • ${esc(e.location)}</p><p>${esc(e.description)}</p></div><div class="eventBadge"><b>+${b?.points||0} pts</b><span>${esc(b?.name||'Event badge')}</span></div></article>`}

function login(){return `<main class="center"><div class="auth"><div class="authLogo"><img src="${logo}"></div><span class="kicker">WELCOME BACK</span><h1>Your Roadrunner journey starts here.</h1><p class="muted">This demo has family and admin views ready to explore.</p><label>Email<input value="smith@example.com"></label><label>Password<input type="password" value="demo123"></label><button class="primary full" onclick="setView('dashboard')">Sign In →</button><button class="textBtn" onclick="setView('admin')">PTA admin? Enter the admin demo</button><div class="demoNote"><b>Demo mode:</b> no real accounts are created. Data is stored only in this browser so you can test the flows.</div></div></main>`}
function dashboard(){const f=state.families[0],p=total(f),level=Math.max(1,Math.floor(p/75)+1),earned=f.members.flatMap(m=>m.badges),upcoming=state.events.filter(e=>e.active&&e.date>='2026-09-04').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);return `<main class="dashboard"><div class="dashHero"><div><span class="kicker">WELCOME, ${esc(f.name.toUpperCase())}</span><h1>Your Roadrunner collection</h1><p>Keep showing up, lending a hand, and making a difference.</p></div><button class="primary" onclick="setView('claim')">▣ Claim a Badge</button></div><div class="stats"><div><span>Family Points</span><strong>${p}</strong><small>${Math.max(0,level*75-p)} to next level</small></div><div><span>Badges Collected</span><strong>${earned.length}</strong><small>Across ${f.members.length} family members</small></div><div><span>Roadrunner Level</span><strong>${level}</strong><small>${level>=4?'Super Roadrunner':'Keep going!'}</small></div></div><section class="dashGrid"><div class="panel"><div class="panelHead"><div><span class="kicker">FAMILY</span><h2>Your Roadrunners</h2></div><button class="iconBtn" onclick="toast('Family members can be added in the production version.')">＋</button></div>${f.members.map(m=>`<div class="member"><div class="avatar">${m.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div class="memberInfo"><b>${esc(m.name)}</b><span>${m.kind}${m.grade?' • '+esc(m.grade):''}</span></div><strong>${m.points} pts</strong></div>`).join('')}</div><div class="panel progressPanel"><div class="levelIcon">♛</div><span class="kicker">LEVEL ${level}</span><h2>${level>=4?'Super Roadrunner':'Roadrunner in Training'}</h2><p>${Math.max(0,level*75-p)>0?`You’re ${level*75-p} points away from the next level.`:'You reached the next level!'}</p><div class="progress"><i style="width:${Math.min(100,(p%75)/75*100)}%"></i></div><span class="progressLabel">${p%75} / 75 points</span></div></section><section class="eventSection"><div class="sectionHead"><div><span class="kicker">COMING UP</span><h2>Roadrunner events</h2></div><p>Show up, scan the event QR code, and choose who earned the badge.</p></div><div class="eventList">${upcoming.map(eventCard).join('')||'<div class="empty">No upcoming events yet.</div>'}</div></section><section class="collection"><div class="sectionHead"><div><span class="kicker">BADGE COLLECTION</span><h2>Your family’s badges</h2></div></div><div class="badgeGrid">${state.badges.filter(b=>b.active).map(b=>badgeCard(b,f)).join('')}</div></section></main>`}

function badgeCard(b,f){const members=f.members.filter(m=>m.badges.includes(b.id));const earned=members.length>0;return `<article class="badgeCard ${earned?'':'lockedCard'}"><div class="badgeArt">${b.image}</div><div class="badgeInfo"><span class="tag">${esc(b.category)}</span><h3>${esc(b.name)}</h3><p>${esc(b.description)}</p><div class="badgeBottom"><b>+${b.points} pts</b>${earned?`<span class="earnedText">✓ Earned</span>`:`<span class="locked">Locked</span>`}</div>${earned?`<small>Earned by ${members.map(m=>esc(m.name.split(' ')[0])).join(', ')}</small>`:''}</div></article>`}
function claim(){return `<main class="center"><div class="claim"><div class="claimTop">▣ <span class="kicker">EVENT CHECK-IN</span></div><h1>Scan. Claim. Celebrate.</h1><p class="muted">At an event, scan the posted QR code while signed in. The live version will open this flow with the event already selected.</p><div class="qrMock"><div id="demoQr"></div><span>Demo QR — Harvest Festival</span></div><label>Or paste an event or badge code<input id="token" placeholder="RR-EVENT-HARVEST-2026"></label><button class="secondary full" onclick="findBadge()">Find Event Badge</button><div id="claimOut"></div></div></main>`}
function makeDemoQr(){if(window.QRCode) new QRCode(document.getElementById('demoQr'),{text:'https://roadrunner-rewards.example/claim/RR-EVENT-HARVEST-2026',width:160,height:160})}
function findBadge(){const t=document.getElementById('token').value.trim().toLowerCase();let b=state.badges.find(x=>x.token.toLowerCase()===t);let event=state.events.find(e=>e.token?.toLowerCase()===t);if(event)b=state.badges.find(x=>x.id===event.badgeId);const out=document.getElementById('claimOut');if(!b){out.innerHTML='<div class="error">We could not find that event badge. Try RR-EVENT-HARVEST-2026.</div>';return}const f=state.families[0];out.innerHTML=`<div class="claimResult"><div class="bigBadge">${b.image}</div><div><span class="kicker">${event?'EVENT FOUND':'BADGE FOUND'}</span><h2>${esc(event?.name||b.name)}</h2><p>${esc(event?.description||b.description)}</p><b>+${b.points} Roadrunner Points</b></div><label>Who earned it?<select id="member">${f.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label><button class="primary full" onclick="claimBadge('${b.id}')">Unlock Badge ✓</button></div>`}

function makeDemoQr(){if(window.QRCode) new QRCode(document.getElementById('demoQr'),{text:'https://roadrunner-rewards.example/claim/RR-HARVEST-2026',width:160,height:160})}
function findBadge(){const t=document.getElementById('token').value.trim().toLowerCase();const b=state.badges.find(x=>x.token.toLowerCase()===t);const out=document.getElementById('claimOut');if(!b){out.innerHTML='<div class="error">We could not find that badge. Try RR-HARVEST-2026.</div>';return}const f=state.families[0];out.innerHTML=`<div class="claimResult"><div class="bigBadge">${b.image}</div><div><span class="kicker">BADGE FOUND</span><h2>${esc(b.name)}</h2><p>${esc(b.description)}</p><b>+${b.points} Roadrunner Points</b></div><label>Who earned it?<select id="member">${f.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label><button class="primary full" onclick="claimBadge('${b.id}')">Unlock Badge ✓</button></div>`}
function claimBadge(id){const b=state.badges.find(x=>x.id===id),f=state.families[0],mid=document.getElementById('member').value,m=f.members.find(x=>x.id===mid);if(!b||!m)return;if(m.badges.includes(b.id)){toast('That Roadrunner already has this badge!');return}m.badges.push(b.id);m.points+=b.points;state.claims.push({badgeId:b.id,memberId:m.id,date:new Date().toISOString().slice(0,10)});save();toast(`${b.name} unlocked! +${b.points} points`);setView('dashboard')}
function admin(){return `<main class="admin"><div class="adminHeader"><div><span class="kicker">PTA ADMIN</span><h1>Roadrunner Rewards</h1><p>Manage families, events, badges, points and QR codes.</p></div><div class="adminUser">✓ Admin</div></div><div class="adminTabs"><button class="active" onclick="adminTab('overview')">Overview</button><button onclick="adminTab('events')">Events</button><button onclick="adminTab('users')">Manage Families</button><button onclick="adminTab('badges')">Manage Badges</button><button id="qrTab" onclick="adminTab('qr')">QR Codes</button></div><div id="adminContent"></div></main>`}
function adminTab(tab){document.querySelectorAll('.adminTabs button').forEach(x=>x.classList.remove('active'));document.querySelector(`.adminTabs button[onclick="adminTab('${tab}')"]`)?.classList.add('active');const el=document.getElementById('adminContent');const all=state.families.flatMap(f=>f.members.map(m=>({...m,family:f.name})));if(tab==='overview')el.innerHTML=`<div class="adminStats"><div class="stat"><div class="statIcon">👨‍👩‍👧</div><span>Families</span><strong>${state.families.length}</strong></div><div class="stat"><div class="statIcon">👥</div><span>Members</span><strong>${all.length}</strong></div><div class="stat"><div class="statIcon">📅</div><span>Events</span><strong>${state.events.length}</strong></div><div class="stat"><div class="statIcon">🏅</div><span>Badges Earned</span><strong>${state.claims.length}</strong></div></div><div class="adminGrid"><div class="panel"><div class="panelHead"><div><span class="kicker">RECENT ACTIVITY</span><h2>Latest badge awards</h2></div></div>${state.claims.slice(-6).reverse().map(c=>{const b=state.badges.find(x=>x.id===c.badgeId),m=all.find(x=>x.id===c.memberId);return `<div class="activity"><span class="miniBadge">${b?.image||'🏅'}</span><div><b>${esc(m?.name||'Member')}</b><span>earned ${esc(b?.name||'Badge')}</span></div><small>${c.date}</small></div>`}).join('')}</div><div class="panel quick"><span class="kicker">QUICK ACTIONS</span><button onclick="adminTab('events')">＋ Create an event <span>→</span></button><button onclick="adminTab('users')">＋ Add a family <span>→</span></button><button onclick="adminTab('badges')">＋ Create a badge <span>→</span></button><button onclick="adminTab('qr')">▣ Print event QR codes <span>→</span></button></div></div>`;else if(tab==='events')el.innerHTML=`<div class="adminTwo"><section class="panel"><div class="panelHead"><div><span class="kicker">EVENT CALENDAR</span><h2>Manage Events</h2></div></div><div class="eventList">${state.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(adminEventRow).join('')||'<div class="empty">No events yet.</div>'}</div></section><section class="panel create"><span class="kicker">NEW EVENT</span><h2>Create an event</h2><p class="formHint">Creating an event automatically creates its attendance badge and QR code.</p><label>Event name<input id="eventName" placeholder="Fall Festival"></label><div class="twoFields"><label>Date<input id="eventDate" type="date" value="2026-11-14"></label><label>Time<input id="eventTime" value="5:00 PM" placeholder="5:00 PM"></label></div><label>Location<input id="eventLocation" placeholder="Repetto Elementary School"></label><label>Description<textarea id="eventDesc" placeholder="Tell families what to expect."></textarea></label><div class="twoFields"><label>Badge points<input id="eventPoints" type="number" value="25"></label><label>Badge icon<input id="eventImage" value="🎉"></label></div><label>Badge category<select id="eventCat"><option>School Spirit</option><option>Community</option><option>PTA</option><option>Fundraising</option><option>Family</option></select></label><button class="primary full" onclick="createEvent()">Create Event + Badge ＋</button></section></div>`;else if(tab==='users')el.innerHTML=`<section class="panel"><div class="panelHead"><div><span class="kicker">PEOPLE</span><h2>Manage Families</h2></div><button class="primary" onclick="toast('Family creation is the next production step.')">＋ Add Family</button></div><div class="search">⌕ <input id="familySearch" placeholder="Search families or people..." oninput="filterFamilies()"></div><div id="familyRows">${familyRows('')}</div></section>`;else if(tab==='badges')el.innerHTML=`<div class="adminTwo"><section class="panel"><div class="panelHead"><div><span class="kicker">BADGE LIBRARY</span><h2>Manage Badges</h2></div></div>${state.badges.map(b=>`<div class="badgeAdmin"><span class="miniBadge">${b.image}</span><div><b>${esc(b.name)}</b><span>${esc(b.category)} • ${b.points} points • ${b.active?'Active':'Inactive'}</span></div><button class="iconBtn" onclick="toggleBadge('${b.id}')">${b.active?'✓':'○'}</button></div>`).join('')}</section><section class="panel create"><span class="kicker">NEW BADGE</span><h2>Create a badge</h2><label>Badge icon / emoji<input id="newImage" value="⭐"></label><label>Name<input id="newName" placeholder="Volunteer MVP"></label><label>Description<textarea id="newDesc" placeholder="Describe what families did to earn it."></textarea></label><div class="twoFields"><label>Points<input id="newPoints" type="number" value="10"></label><label>Category<select id="newCat"><option>Community</option><option>PTA</option><option>Fundraising</option><option>School Spirit</option><option>Family</option></select></div><button class="primary full" onclick="createBadge()">Create Badge ＋</button></section></div>`;else if(tab==='qr')el.innerHTML=`<section class="panel"><div class="panelHead"><div><span class="kicker">EVENT CHECK-IN</span><h2>Event QR Codes</h2></div><button class="primary" onclick="window.print()">▣ Print Page</button></div><p class="muted">Post these codes at events. Families scan, choose the family member who participated, and earn the event badge.</p><div class="qrGrid">${state.events.filter(e=>e.active).map(e=>{const b=state.badges.find(x=>x.id===e.badgeId);return `<div class="qrCard"><div class="qr" id="qr-${e.id}"></div><div style="font-size:32px">${b?.image||'🎉'}</div><h3>${esc(e.name)}</h3><b>+${b?.points||0} points</b><code>${esc(e.token||b?.token||'')}</code></div>`}).join('')}</div></section>`;setTimeout(()=>{if(tab==='qr'&&window.QRCode)state.events.filter(e=>e.active).forEach(e=>{const el=document.getElementById('qr-'+e.id);if(el)new QRCode(el,{text:'https://roadrunner-rewards.example/claim/'+(e.token||''),width:130,height:130})})},50)}
function adminEventRow(e){const b=state.badges.find(x=>x.id===e.badgeId),d=new Date(e.date+'T12:00:00');return `<div class="adminEvent"><div class="eventDate"><b>${d.getDate()}</b><span>${d.toLocaleString('en-US',{month:'short'})}</span></div><div class="eventInfo"><h3>${esc(e.name)}</h3><p>${esc(e.time)} • ${esc(e.location)}</p><p><span class="pill">${b?.points||0} point badge</span> ${e.active?'Active':'Inactive'}</p></div><div class="eventActions"><button class="iconBtn" onclick="showEventQr('${e.id}')">▣</button><button class="iconBtn" onclick="toggleEvent('${e.id}')">${e.active?'✓':'○'}</button></div></div>`}
function showEventQr(id){location.hash='qr';adminTab('qr');toast('Event QR codes are ready to print.')}
function toggleEvent(id){const e=state.events.find(x=>x.id===id);if(e){e.active=!e.active;save();adminTab('events');toast(`${e.name} is now ${e.active?'active':'inactive'}.`)}}
function createEvent(){const name=document.getElementById('eventName').value.trim(),date=document.getElementById('eventDate').value;if(!name||!date){toast('Add an event name and date first.');return}const slug=name.toUpperCase().replace(/[^A-Z0-9]+/g,'-').slice(0,22),stamp=String(Date.now()).slice(-5),bid='b-'+Date.now(),eid='e-'+Date.now();const badge={id:bid,name:name+' Hero',description:'Attended '+name+'.',points:Number(document.getElementById('eventPoints').value)||25,category:document.getElementById('eventCat').value,image:document.getElementById('eventImage').value.trim()||'🎉',active:true,token:'RR-'+slug+'-'+stamp};const event={id:eid,name,date,time:document.getElementById('eventTime').value.trim()||'TBD',location:document.getElementById('eventLocation').value.trim()||'Repetto Elementary School',description:document.getElementById('eventDesc').value.trim()||'Join the Repetto community!',badgeId:bid,active:true,token:'RR-EVENT-'+slug+'-'+stamp};state.badges.push(badge);state.events.push(event);save();adminTab('events');toast('Event created with an attendance badge and QR code!')}
function familyRows(q){return state.families.filter(f=>(f.name+' '+f.email+' '+f.members.map(m=>m.name).join(' ')).toLowerCase().includes(q.toLowerCase())).map(f=>`<div class="familyRow"><div><b>${esc(f.name)}</b><span>${esc(f.email)} • ${f.members.length} members</span></div><strong>${total(f)} pts</strong><button class="iconBtn" onclick="toast('Family editing is wired for the production database.')">⚙</button></div>`).join('')||'<p class="muted">No families found.</p>'}function filterFamilies(){document.getElementById('familyRows').innerHTML=familyRows(document.getElementById('familySearch').value)}function toggleBadge(id){const b=state.badges.find(x=>x.id===id);if(b){b.active=!b.active;save();adminTab('badges');toast(`${b.name} is now ${b.active?'active':'inactive'}.`)}}function createBadge(){const name=document.getElementById('newName').value.trim();if(!name){toast('Give your badge a name first.');return}const b={id:'b-'+Date.now(),name,description:document.getElementById('newDesc').value.trim()||'A new Roadrunner achievement.',points:Number(document.getElementById('newPoints').value)||10,category:document.getElementById('newCat').value,image:document.getElementById('newImage').value.trim()||'⭐',active:true,token:'RR-'+name.toUpperCase().replace(/[^A-Z0-9]+/g,'-').slice(0,24)+'-'+String(Date.now()).slice(-4)};state.badges.push(b);save();adminTab('badges');toast('Badge created!')}

render();
</script></body></html>
